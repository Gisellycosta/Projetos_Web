</head>
<body>
  <h1> Calculadora de desconto</h1>

  </form>
  <div>
    <h3>Resultado</h3>
    <p id="Resultado1"> </p>
    <p id="Resultado2"> </p>

    <p id="Resultado4"> </p>
  </div>
</body>
